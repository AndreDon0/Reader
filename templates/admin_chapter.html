{% extends 'base.html' %}
{% block title %}Edit chapter · Reader{% endblock %}
{% block content %}
<a class="back-link" href="{{ url_for('admin_book', book_id=chapter.id_book) }}">← Edit title</a>
<h1>Edit chapter {{ chapter.number }}</h1>
<form method="post" class="panel stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Display name <input name="display_name" value="{{ chapter.display_name or '' }}" placeholder="{{ chapter.name }}" maxlength="1000"></label>
  <label class="check"><input name="hidden" value="1" type="checkbox" {% if chapter.hidden %}checked{% endif %}> Hide from Reader</label>
  <button class="button" name="action" value="save">Save chapter</button>
</form>
<form method="post" class="panel action-row delete-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Type DELETE to confirm <input name="confirm" required pattern="DELETE" autocomplete="off"></label>
  <button class="button danger" name="action" value="delete">Delete chapter permanently</button>
</form>
{% endblock %}
