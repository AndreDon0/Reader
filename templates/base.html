<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Reader · Your library{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='reader.css') }}">
  <script defer src="{{ url_for('static', filename='reader.js') }}"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="{{ url_for('library') }}"><span class="brand-icon" aria-hidden="true">▤</span> Reader<span class="brand-dot">.</span></a>
    <nav aria-label="Main navigation">
      {% if g.user %}
        <a class="nav-link" href="{{ url_for('catalog') }}">Catalog</a>
        <a class="nav-link" href="{{ url_for('my_library') }}">My library</a>
        <a class="nav-link" href="{{ url_for('library', _anchor='preferences') }}">Preferences</a>
        {% if g.user.is_admin %}<a class="nav-link" href="{{ url_for('admin_settings') }}">Admin</a>{% endif %}
        <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="nav-link nav-button" type="submit">Sign out</button></form>
      {% endif %}
      <button class="icon-button" type="button" data-theme-toggle aria-label="Switch color theme" title="Switch color theme">◐</button></nav>
  </div></header>
  <main id="main" class="{% block main_class %}container{% endblock %}">{% block content %}{% endblock %}</main>
  <footer class="site-footer"><span>Reader</span><span>A little space for your next chapter.</span></footer>
</body>
</html>
