<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Reader · Your library{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='reader.css') }}">
  <script defer src="{{ url_for('static', filename='reader.js') }}"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="{{ url_for('library') }}"><span class="brand-icon" aria-hidden="true">▤</span> Reader<span class="brand-dot">.</span></a>
    <nav aria-label="Main navigation"><a class="nav-link" href="{{ url_for('library') }}">Your library</a><button class="icon-button" type="button" data-theme-toggle aria-label="Switch color theme" title="Switch color theme">◐</button></nav>
  </div></header>
  <main id="main" class="{% block main_class %}container{% endblock %}">{% block content %}{% endblock %}</main>
  <footer class="site-footer"><span>Reader</span><span>A little space for your next chapter.</span></footer>
</body>
</html>
