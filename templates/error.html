{% extends 'base.html' %}
{% block title %}{{ code }} · Reader{% endblock %}
{% block content %}<section class="empty-state error-page"><p class="eyebrow">{{ code }}</p><h1>{% if code == 404 %}Page not found{% elif code == 503 %}The library is taking a moment{% else %}Something needs another try{% endif %}</h1><p class="muted">{{ message }}</p><a class="button" href="{{ url_for('library') }}">Back to library</a></section>{% endblock %}
