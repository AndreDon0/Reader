{% macro icon(name, size=24) -%}
<svg aria-hidden="true" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    {% if name == "book" %}
        <path d="M12 7c-2.7-2.1-6.2-2.7-9-1v12c2.8-1.7 6.3-1.1 9 1 2.7-2.1 6.2-2.7 9-1V6c-2.8-1.7-6.3-1.1-9 1Zm0 0v12"/>
    {% elif name == "search" %}
        <circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>
    {% elif name == "library" %}
        <rect x="3.5" y="5" width="4" height="14" rx=".75"/><rect x="7.5" y="4" width="4.5" height="15" rx=".75"/><path d="m13 6 3.2-1a.8.8 0 0 1 1 .5l3.7 11.3a.8.8 0 0 1-.5 1l-3.2 1a.8.8 0 0 1-1-.5L12.5 7a.8.8 0 0 1 .5-1ZM2.5 19.5h19"/>
    {% elif name == "history" %}
        <path d="M3 12a9 9 0 1 1 2.4 6.1M3 12V6m0 6h6m3-5v5l3 2"/>
    {% elif name == "catalog" %}
        <rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/>
    {% elif name == "settings" %}
        <path d="M10.2 3.6h3.6l.6 2.1 1.4.8 2.1-.6 1.8 3.1-1.5 1.6v1.7l1.5 1.6-1.8 3.1-2.1-.6-1.4.8-.6 2.1h-3.6l-.6-2.1-1.4-.8-2.1.6-1.8-3.1 1.5-1.6v-1.7L4.3 9l1.8-3.1 2.1.6 1.4-.8.6-2.1Z" transform="translate(0 .5)"/><circle cx="12" cy="12" r="2.7"/>
    {% elif name == "account" %}
        <circle cx="12" cy="8" r="3.4"/><path d="M5 20v-1.5A4.5 4.5 0 0 1 9.5 14h5a4.5 4.5 0 0 1 4.5 4.5V20"/>
    {% elif name == "bookmark" %}
        <path d="M6 4h12v16l-6-4-6 4zM12 7v5m-2.5-2.5h5"/>
    {% elif name == "chevron" %}
        <path d="m6 9 6 6 6-6"/>
    {% elif name == "check" %}
        <path d="m5 12 4 4L19 6"/>
    {% elif name == "calendar" %}
        <rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18"/>
    {% elif name == "previous" %}
        <path d="m15 6-6 6 6 6"/>
    {% elif name == "next" %}
        <path d="m9 6 6 6-6 6"/>
    {% endif %}
</svg>
{%- endmacro %}
