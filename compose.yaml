services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: reader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: reader

    ports:
      - "127.0.0.1:60209:5432"

    volumes:
      - /srv/storage/reader/database:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reader -d reader"]
      interval: 10s
      timeout: 5s
      retries: 5