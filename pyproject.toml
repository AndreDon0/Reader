[project]
name = "reader"
version = "0.1.0"
description = "Project for learning how to read different languages"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "beautifulsoup4>=4.15.0",
    "dotenv>=0.9.9",
    "flask>=3.1.3",
    "lxml>=6.1.3",
    "marimo>=0.25.2",
    "psycopg[binary]>=3.3.6",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.6",
    "sqlalchemy-utils>=0.43.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
deploy = [
    "gunicorn>=23",
]
